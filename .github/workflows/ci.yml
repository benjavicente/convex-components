name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ready:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Installs the pnpm from devEngines, Node, and the locked dependencies.
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          require-lockfile: true
          cache: true
      - run: pnpm run ready
