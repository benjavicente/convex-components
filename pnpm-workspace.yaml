packages:
  - components/*
  - examples/*

# Shared versions: package.json files use "catalog:".
catalog:
  "@edge-runtime/vm": 5.0.0
  "@types/node": 26.6.6
  aws4fetch: 1.0.20
  convex: 1.50.0
  convex-test: 0.0.71
  typescript: 7.0.2
  vite-plus: 1.6.0

catalogMode: strict
savePrefix: ""
# The Convex CLI bundles functions with esbuild, which needs its install script.
permissions:
  esbuild:
    build: true
